<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FomoFinder</title><meta name="description" content="FomoFinder: look up public info tied to a Solana wallet (pump.fun, X, .sol domains, holdings, wallet age)."><meta property="og:title" content="FomoFinder"><meta property="og:description" content="Look up public info tied to any Solana wallet."><meta name="twitter:title" content="FomoFinder"><meta name="application-name" content="FomoFinder"><meta name="theme-color" content="#07070a">
<style>
:root{--bg:#07070a;--card:#111117;--line:#22222c;--mut:#8a8a99;--txt:#ededf2;--acc:#ff7a1a;--ok:#2bd67b;--warn:#ffb020}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(1200px 600px at 50% -10%,#24140a 0,var(--bg) 60%);color:var(--txt);font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}
.wrap{max-width:980px;margin:0 auto;padding:48px 20px}
h1{font-size:34px;letter-spacing:-.02em;margin:0 0 6px}h1 span{color:var(--acc)}.sub{color:var(--mut);margin:0 0 28px}
form{display:flex;gap:10px}input{flex:1;background:#0d0d12;border:1px solid var(--line);color:var(--txt);padding:15px 18px;border-radius:14px;font:inherit;font-family:ui-monospace,Menlo,monospace;font-size:14px;outline:none}
input:focus{border-color:var(--acc)}button{background:var(--acc);color:#111;border:0;border-radius:14px;padding:0 26px;font-weight:700;cursor:pointer;font-size:15px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:22px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 20px}
.full{grid-column:1/-1}.hd{display:flex;gap:16px;align-items:center}.av{width:64px;height:64px;border-radius:50%;object-fit:cover;border:2px solid var(--acc);background:#222}
.k{color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px;display:flex;justify-content:space-between}
.src{font-size:10px;letter-spacing:0;text-transform:none;color:#5d5d6b}.big{font-size:22px;font-weight:700}code{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;color:#d0d0dc;word-break:break-all}
a{color:var(--acc);text-decoration:none}a:hover{text-decoration:underline}.row{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid var(--line)}.row:first-of-type{border-top:0}
.pill{display:inline-block;padding:3px 10px;border-radius:99px;background:#1b1b23;border:1px solid var(--line);margin:3px 6px 3px 0;font-size:13px}
.warn{color:var(--warn)}.mut{color:var(--mut)}.links a{display:inline-block;margin:4px 6px 4px 0;padding:7px 12px;border:1px solid var(--line);border-radius:10px;background:#0d0d12}
#st{color:var(--mut);margin-top:16px}
@media(max-width:700px){.wrap{padding:28px 14px}h1{font-size:26px}form{flex-direction:column}button{padding:14px}.grid{grid-template-columns:1fr}.row{flex-wrap:wrap}.row code{font-size:11px}.hd{align-items:flex-start}.av{width:52px;height:52px}}
.spin{display:inline-block;width:14px;height:14px;border:2px solid #444;border-top-color:var(--acc);border-radius:50%;animation:s 1s linear infinite;vertical-align:-2px;margin-right:8px}@keyframes s{to{transform:rotate(360deg)}}
</style></head><body><div class="wrap">
<h1>Fomo<span>Finder</span></h1><p class="sub">Paste a Solana wallet, pump.fun profile link or username. Every fact links to its public source.</p>
<form id="f"><input id="q" placeholder="Solana wallet · pump.fun URL · username" autocomplete="off"><button>Look up</button></form>
<div id="st"></div><div id="out"></div></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const usd=v=>v==null?'':'$'+Number(v).toLocaleString(undefined,{maximumFractionDigits:0});
const day=t=>t?new Date(t*1000).toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'}):'?';
const card=(k,src,body,cls='')=>`<div class="card ${cls}"><div class="k">${k}<span class="src">${esc(src||'')}</span></div>${body}</div>`;
async function go(q){$('#st').innerHTML='<span class=spin></span>Looking up… (up to ~15s for busy wallets)';$('#out').innerHTML='';history.replaceState(null,'','?q='+encodeURIComponent(q));document.title='FomoFinder · '+q.slice(0,8);
 let r;try{r=await (await fetch('/api/lookup?q='+encodeURIComponent(q))).json()}catch(e){$('#st').textContent='Lookup failed, try again.';return}if(r.error||r.detail){$('#st').textContent=r.error||r.detail;return}$('#st').textContent='';
 const p=r.pump||{},x=r.x||{},d=r.domains||{},h=r.holdings||{},hi=r.history||{},f=r.fomo||{};let o='<div class="grid">';const k=r.kolscan||{};
 o+=card('Found on','',(r.found_on||[]).length?r.found_on.map(n=>`<span class="pill${n.includes('unverified')?' warn':''}">${esc(n)}</span>`).join(''):'<span class="mut">No public identity found</span>','full');
 o+=card('Wallet','',`<div class="hd">${p.image?`<img class="av" src="${esc(p.image)}">`:''}<div><div class="big">${esc(p.username||d.primary||'Unknown wallet')}</div><code>${r.wallet}</code>${p.bio?`<div class="mut">${esc(p.bio)}</div>`:''}</div></div>`,'full');
 o+=card('pump.fun',r.pump?'frontend-api-v3.pump.fun':'',r.pump?`<div class="row"><span>Profile</span><a href="${p.link}" target=_blank>${esc(p.username)}</a></div><div class="row"><span>Followers</span><b>${(p.followers||0).toLocaleString()}</b></div><div class="row"><span>Following</span><b>${(p.following||0).toLocaleString()}</b></div><div class="row"><span>Linked EVM</span><code>${esc(p.evm_wallet||'—')}</code></div><div class="row"><span>Coins created</span><b>${p.coins_created.length}</b></div>${p.coins_created.slice(0,5).map(c=>`<div class="row"><a href="${c.link}" target=_blank>$${esc(c.symbol)}</a><code>${c.mint}</code></div>`).join('')}`:'<span class="mut">No pump.fun profile</span>');
 o+=card('X / Twitter',x.source,(x.handle?`<div class="row"><span>Account</span><a href="${x.link}" target=_blank>@${esc(x.handle)}</a></div>${x.profile?`<div class="row"><span>Followers</span><b>${x.profile.public_metrics.followers_count.toLocaleString()}</b></div>`:''}`:'<span class="mut">No linked X account</span>')+`${(x.mentions||[]).map(m=>`<div class="row"><a href="${m.link}" target=_blank>@${esc(m.handle)}</a><span class="mut">${esc(m.text.slice(0,60))}</span></div>`).join('')}<div class="row"><span>Posts mentioning wallet</span><a href="${x.search_link}" target=_blank>search X ↗</a></div>${x.handle?`<div class="row"><span>Posts by/about @${esc(x.handle)}</span><a href="https://x.com/search?q=${encodeURIComponent('@'+x.handle)}&f=live" target=_blank>search X ↗</a></div>`:''}${x.note?`<div class="mut" style="font-size:12px">Live X search needs an API key on this server.</div>`:''}`);
 const st=(k.stats||{})['1']||Object.values(k.stats||{})[0];
 o+=card('KOLscan',`${k.tracked_kols||0} tracked KOLs`,k.is_kol?`<div class="row"><span>KOL</span><a href="${k.link}" target=_blank>${esc(k.name)}</a></div>${k.twitter?`<div class="row"><span>X</span><a href="${esc(k.twitter)}" target=_blank>${esc(k.twitter.split('/').pop())}</a></div>`:''}${Object.entries(k.stats||{}).map(([tf,s])=>`<div class="row"><span>${tf==='1'?'Today':tf+'d'}</span><b>#${s.rank} · ${s.profit_sol>=0?'+':''}${s.profit_sol.toFixed(1)} SOL · ${s.wins}W/${s.losses}L</b></div>`).join('')}`:`<span class="mut">Not a KOLscan-tracked wallet</span>${(k.same_x_handle_kol_wallets||[]).map(a=>`<div class="row"><span>KOL with same X handle</span><a href="${a.link}" target=_blank>${esc(a.name)}</a></div>`).join('')}`);
 o+=card('Domains',d.source,d.domains&&d.domains.length?d.domains.map((n,i)=>`<a class="pill" href="${d.links[i]}" target=_blank>${esc(n)}${n===d.primary?' ★':''}</a>`).join(''):'<span class="mut">No .sol domains</span>');
 o+=card('Wallet age & funding','Solana RPC',hi.complete?`<div class="row"><span>First tx</span><a href="${hi.first_tx_link}" target=_blank>${day(hi.first_seen)}</a></div><div class="row"><span>Transactions</span><b>${hi.tx_count}</b></div>${hi.first_fee_payer?`<div class="row"><span>Gas paid by</span><a href="${hi.first_fee_payer_link}" target=_blank><code>${hi.first_fee_payer.slice(0,8)}…</code></a></div><div class="mut" style="font-size:12px">${esc(hi.funding_note)}</div>`:''}${hi.funded_by?`<div class="row"><span>Funded by</span><a href="${hi.funded_by_link}" target=_blank><code>${hi.funded_by.slice(0,8)}…</code></a> ${hi.funded_sol.toFixed(3)} SOL</div>`:''}`:`<div class="row"><span>Active since at least</span><b>${day(hi.oldest_seen)}</b></div><div class="row"><span>Transactions</span><b>${(hi.tx_count_min||0).toLocaleString()}+</b></div><div class="mut" style="font-size:12px">Too many txs to reach the first one on a free RPC.</div>`);
 o+=card('Holdings','RPC + Jupiter',`<div class="row"><span>SOL</span><b>${h.sol==null?'?':h.sol.toFixed(3)} ${h.sol_usd?'<span class=mut>'+usd(h.sol_usd)+'</span>':''}</b></div><div class="row"><span>Tokens</span><b>${h.token_count}</b></div>${(h.top||[]).filter(t=>t.symbol).slice(0,5).map(t=>`<div class="row"><a href="${t.link}" target=_blank>$${esc(t.symbol)}</a><span>${usd(t.usd)}</span></div>`).join('')}`);
 o+=card('Fomo','',f.guess_link?`<div class="row"><a href="${f.guess_link}" target=_blank>${esc(f.guess_link.replace('https://',''))}</a><span class="warn">⚠ unverified guess</span></div><div class="mut" style="font-size:12px">${esc(f.note)}</div>`:`<span class="mut">${esc(f.note)}</span>`);
 o+=card('Explore','',`<div class="links">${Object.entries(r.links).map(([k,u])=>`<a href="${u}" target=_blank>${k} ↗</a>`).join('')}</div>`,'full');
 $('#out').innerHTML=o+'</div>'}
$('#f').onsubmit=e=>{e.preventDefault();go($('#q').value.trim())};const q0=new URLSearchParams(location.search).get('q');if(q0){$('#q').value=q0;go(q0)}
</script></body></html>
